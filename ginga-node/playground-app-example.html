<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ginga-node: Playground Example</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.5rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .status {
      font-size: 0.875rem;
      color: #94a3b8;
      background: #0f172a;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid #334155;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    iframe {
      width: 90vw;
      height: 85vh;
      max-width: 1400px;
      max-height: 900px;
      border: 1px solid #334155;
      border-radius: 8px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>

<body>
  <header>
    <title>ginga-node: Playground app example</title>
    <div class="status">Opening Playground via ?app= (Press Run to Start)</div>
  </header>
  <main>
    <iframe
      src="./playground.html?app=https://raw.githubusercontent.com/ginga-org-br/gingaf/refs/heads/main/gingaf/ginga/examples/video.ncl"></iframe>
  </main>
</body>

</html>
