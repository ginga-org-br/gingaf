<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gingaf (web): Playground app example</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body > header {
      padding: 1rem 1.5rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    body > header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #38bdf8;
    }

    body > main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
      min-height: 0;
    }

    #app {
      width: 90vw;
      height: 85vh;
      max-width: 1400px;
      max-height: 900px;
      border: 1px solid #334155;
      border-radius: 8px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
    }
  </style>
</head>

<body data-mode="playgroundSingle">
  <header>
    <h1>gingaf (web): Playground alone example</h1>
    <div id="player-url" style="font-size: 0.85rem; color: #94a3b8; font-family: monospace; background: #0f172a; padding: 0.25rem 0.75rem; border-radius: 9999px; border: 1px solid #334155; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></div>
  </header>
  <main>
    <div id="app"></div>
  </main>
  <script type="module"
    src="/src/main.ts?mode=playgroundSingle&app=https://raw.githubusercontent.com/ginga-org-br/gingaf/refs/heads/main/examples/video.ncl"></script>
  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      let app = urlParams.get('app');
      if (!app) {
        const scriptEl = document.querySelector('script[src*="main.ts"], script[src*="bundle.js"]');
        if (scriptEl) {
          const src = scriptEl.getAttribute('src') || scriptEl.src;
          const qIdx = src.indexOf('?');
          if (qIdx !== -1) {
            const scriptParams = new URLSearchParams(src.slice(qIdx));
            app = scriptParams.get('app');
          }
        }
      }
      const el = document.getElementById('player-url');
      if (el && app) {
        el.textContent = app;
        el.title = app;
      }
    })();
  </script>
</body>

</html>
