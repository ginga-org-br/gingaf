<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <script>let p=window.location.pathname;if(!p.endsWith('/')){p=(p.endsWith('.html')||p.endsWith('.htm'))?p.substring(0,p.lastIndexOf('/')+1):p+'/';}const b=document.createElement('base');b.href=p;document.head.prepend(b);</script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gingaf">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2" />
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2" />

  <title>ginga</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
    }

    #ginga-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: transparent;
    }

    video {
      object-fit: fill !important;
    }
  </style>
</head>

<body>
  <div id="ginga-container"></div>
  <script>
    if (window.parent === window && !location.search.includes('tv30') && !location.search.includes('transparent') && !location.search.includes('overlay')) {
      document.body.style.backgroundColor = '#000000';
    }
  </script>
  <script>
    var serviceWorkerVersion = null;
    // Web browsers require user interaction before unmuting media playback.
    // Unmute videos upon user gesture.
    // See: https://developer.mozilla.org/en-US/docs/Web/Media/Autoplay_guide
    window.addEventListener('click', function () {
      document.querySelectorAll('video').forEach(function (video) {
        if (video.muted) {
          video.muted = false;
        }
      });
    }, { once: false });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
