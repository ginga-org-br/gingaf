name: gingaf
description: multi-platform ginga player for web, mobile, and desktop
publish_to: "none"

version: 0.1.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  webview_all: ^1.0.3
  logging: ^1.3.0
  video_player: ^2.8.6
  video_player_win: ^3.2.2
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.1.0
  ncldoc:
    path: ../ncldoc
  ccws:
    path: ../ccws

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  test: ^1.29.0
  video_player_platform_interface: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/
