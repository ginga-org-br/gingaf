name: gingaf
description: multi-platform ginga player for web, mobile, and desktop
publish_to: "none"

version: 0.4.0

environment:
  sdk: ">=3.5.0 <4.0.0"

workspace:
  - packages/gingacc
  - packages/ginga_app
  - packages/ginga_appui
  - packages/plugins
  - packages/playground

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.2
  webview_all: ^1.0.3
  logging: ^1.3.0
  video_player: ^2.14.0
  video_player_media_kit: ^2.0.0
  media_kit_libs_windows_video: ^1.0.0
  media_kit_libs_linux: ^1.0.4
  http: ^1.1.0
  path: ^1.9.0
  web: ^1.0.0
  shelf: ^1.4.1
  xml: ^7.0.1
  gingacc:
  ginga_app:
  ginga_appui:
  plugins:
  get_it: ^9.3.0
  playground:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  test: ^1.29.0
  video_player_platform_interface: ^6.9.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/examplesDev/
