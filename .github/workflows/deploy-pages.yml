name: Deploy Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build node module
        working-directory: ./node
        run: |
          npm install
          npm run build
      - name: Generate documentation
        run: make doc
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Prepare site directory
        run: |
          mkdir -p site
          touch site/.nojekyll
          cp -r node/playground site/playground
          cp -r doc/api site/docs
      - name: Generate redirect page
        run: |
          cat << 'EOF' > site/playground/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Redirecting to ginga.org.br/gingaf/playground</title>
            <meta http-equiv="refresh" content="0; url=https://ginga.org.br/gingaf/playground/">
            <link rel="canonical" href="https://ginga.org.br/gingaf/playground/">
            <script>
              (function () {
                window.location.replace("https://ginga.org.br/gingaf/playground/" + window.location.search + window.location.hash);
              })();
            </script>
          </head>
          <body>
            <p>Redirecting to <a href="https://ginga.org.br/gingaf/playground/">ginga.org.br/gingaf/playground</a>...</p>
          </body>
          </html>
          EOF
          cp site/playground/index.html site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}playground/
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
