name: Deploy Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Generate redirect page
        run: |
          mkdir -p site/playground
          touch site/.nojekyll
          cat << 'EOF' > site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Redirecting to ginga.org.br/gingaf/playground</title>
            <meta http-equiv="refresh" content="0; url=https://ginga.org.br/gingaf/playground/">
            <link rel="canonical" href="https://ginga.org.br/gingaf/playground/">
            <script>
              (function () {
                var pathname = window.location.pathname;
                var target = "https://ginga.org.br/gingaf/playground/";
                if (pathname.includes('/gingaf/playground')) {
                  target = "https://ginga.org.br" + (pathname.endsWith('/') ? pathname : pathname + '/');
                }
                window.location.replace(target + window.location.search + window.location.hash);
              })();
            </script>
          </head>
          <body>
            <p>Redirecting to <a href="https://ginga.org.br/gingaf/playground/">ginga.org.br/gingaf/playground</a>...</p>
          </body>
          </html>
          EOF
          cp site/index.html site/playground/index.html
          cp site/index.html site/404.html
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}playground/
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
